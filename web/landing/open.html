<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Open Blanked</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #111827;
      }

      main {
        width: min(420px, calc(100vw - 32px));
        text-align: center;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 8px;
        background: #111827;
        color: white;
        font-weight: 650;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Open Blanked</h1>
      <p>Install Blanked to use BAI and apply this action.</p>
      <a id="openLink" href="https://apps.apple.com/">Open Blanked</a>
    </main>
    <script>
      const allowedActions = new Set([
        "apply-plan",
        "daily-limit",
        "start-focus",
        "open-picker",
        "choose-apps",
        "setup-plan",
        "allow-only",
        "adult-filter",
        "pause-rules",
        "resume-rules",
        "mode"
      ]);

      function validAction(value) {
        return allowedActions.has(value || "");
      }

      function legacyTarget(value) {
        try {
          const url = new URL(value);
          const action = url.hostname || url.pathname.replace(/^\/+/, "");
          return url.protocol === "blank:" && validAction(action) ? value : "";
        } catch (_) {
          return "";
        }
      }

      function targetFromQuery(params) {
        const action = params.get("action") || "";
        if (!validAction(action)) return legacyTarget(params.get("to") || "");
        const target = new URL(`blank://${action}`);
        for (const [key, value] of params.entries()) {
          if (key === "action" || key === "to") continue;
          target.searchParams.set(key, value);
        }
        return target.toString();
      }

      const target = targetFromQuery(new URLSearchParams(window.location.search));
      const link = document.getElementById("openLink");
      if (target) {
        link.href = target;
        window.setTimeout(() => {
          window.location.href = target;
        }, 150);
      } else {
        link.style.display = "none";
      }
    </script>
  </body>
</html>
