<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blankmind Early Access</title>
    <meta name="description" content="Join Blankmind Early Access and start a private conversation about your relationship with your phone.">
    <meta name="robots" content="noindex,follow">
    <link rel="stylesheet" href="styles.css?v=20260919-waitlist-1">
  </head>
  <body>
    <main class="early-access">
      <a href="/" class="plain-link">Blankmind</a>
      <h1>Early Access</h1>
      <p>I’d like to understand how your phone fits into your life before I invite you in. Verify your number and I’ll start the conversation with you on WhatsApp.</p>

      <form id="phone-form" class="access-form">
        <label for="phone">Your WhatsApp number</label>
        <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+34 600 000 000" required>
        <label class="consent-row">
          <input id="consent" type="checkbox" required>
          <span>I agree that Blankmind may message me on WhatsApp and securely process this conversation, including voice-note transcripts, to understand my Early Access profile. I can stop or delete my data at any time.</span>
        </label>
        <button type="submit">Continue</button>
      </form>

      <form id="code-form" class="access-form" hidden>
        <label for="code">Verification code</label>
        <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" required>
        <button type="submit">Verify and start</button>
      </form>

      <p id="status" class="access-status" role="status" aria-live="polite"></p>
      <p class="access-privacy">Read the <a href="/privacy.html">Privacy Policy</a>.</p>
    </main>
    <script src="early-access.js?v=20260919-waitlist-1" defer></script>
  </body>
</html>
